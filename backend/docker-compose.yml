services:
  postgres:
    image: postgres:16-alpine
    container_name: kosanhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosanhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kosanhub_postgres_data:/var/lib/postgresql/data

volumes:
  kosanhub_postgres_data:
